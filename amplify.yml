version: 1
applications:
  - appRoot: app
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - env | grep -E '^(MONGODB_URI|GEMINI_|SUPERMEMORY_|TINYFISH_|BEDROCK_|TIGER_URL|NEXT_PUBLIC_|XAI_|DISCORD_)' >> .env.production
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
